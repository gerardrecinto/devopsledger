name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "apps/api/app/scoring/**", "apps/api/app/integrations/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/py/app/scoring _site/py/app/integrations/terraform _site/py/app/integrations/github
          cp site/index.html _site/
          cp apps/api/app/scoring/*.py _site/py/app/scoring/
          cp apps/api/app/integrations/terraform/parser.py _site/py/app/integrations/terraform/
          cp apps/api/app/integrations/github/parser.py _site/py/app/integrations/github/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
